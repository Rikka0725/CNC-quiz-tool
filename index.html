<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>数控技术刷题</title>
<style>
:root{
  --bg:#f4f6fb; --card:#ffffff; --ink:#111827; --muted:#6b7280; --line:#e5e7eb;
  --accent:#2563eb; --accent-2:#4f46e5; --ok:#16a34a; --bad:#dc2626;
  --shadow:0 12px 28px -18px rgba(17,24,39,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg); color:var(--ink); font-size:16px; line-height:1.55;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  overscroll-behavior-y:none;
}
#app{max-width:560px;margin:0 auto;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
.screen{display:none;min-height:100dvh;flex-direction:column}
.screen.active{display:flex}
.hidden{display:none !important}
button{font:inherit;color:inherit}
.btn{
  appearance:none;border:0;border-radius:16px;font-weight:600;font-size:17px;
  padding:15px 18px;min-height:54px;width:100%;cursor:pointer;
  transition:transform .06s ease, background .15s ease, opacity .15s;
}
.btn:active{transform:scale(.985)}
.btn-primary{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;box-shadow:0 14px 24px -14px rgba(37,99,235,.9)}
.btn-soft{background:#fff;border:1px solid var(--line);color:#1f2937;box-shadow:var(--shadow)}
.btn-ghost{background:#eef2ff;color:#3730a3}
.btn:disabled{opacity:.45;pointer-events:none}

/* ---------- 首页 ---------- */
.hero{
  padding:calc(18px + env(safe-area-inset-top)) 22px 26px;
  background:radial-gradient(120% 100% at 10% 0%,#3b82f6 0%,#2563eb 45%,#4338ca 100%);
  color:#fff;border-radius:0 0 30px 30px;
}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.22);padding:5px 11px;border-radius:999px;font-size:12px;letter-spacing:.5px}
.hero-meta{font-size:12px;color:rgba(255,255,255,.78)}
.hero h1{margin:18px 0 6px;font-size:30px;letter-spacing:1px;line-height:1.25}
.hero p{margin:0;color:rgba(255,255,255,.82);font-size:13.5px;letter-spacing:.4px}
.hero-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.hstat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:16px;padding:11px 8px;text-align:center}
.hstat b{display:block;font-size:20px;line-height:1.2;letter-spacing:.5px}
.hstat span{font-size:11.5px;color:rgba(255,255,255,.75)}
.home-actions{padding:20px 18px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.resume{background:#fff;border:1px dashed #bfdbfe;color:#1d4ed8;border-radius:16px;padding:13px;font-size:15px;font-weight:600;min-height:50px}
.home-tip{text-align:center;color:var(--muted);font-size:12px;margin-top:6px;line-height:1.7}

/* ---------- 通用页头 ---------- */
.topbar{
  position:sticky;top:0;z-index:9;display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  background:rgba(244,246,251,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.icon-btn{
  appearance:none;border:0;background:#fff;border:1px solid var(--line);width:44px;height:44px;
  border-radius:13px;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;
}
.icon-btn:active{background:#eef2ff}
.topbar .title{font-size:16.5px;font-weight:700;letter-spacing:.5px}
.topbar .sub{font-size:12px;color:var(--muted);margin-left:auto}

/* ---------- 开始设置 ---------- */
.pad{padding:18px 18px 30px;display:flex;flex-direction:column;gap:18px}
.section-label{font-size:13px;color:var(--muted);margin:0 0 8px 4px;letter-spacing:.5px}
.kind-list{display:flex;flex-direction:column;gap:10px}
.kind{
  display:flex;align-items:center;gap:14px;background:#fff;border:1.5px solid var(--line);
  border-radius:18px;padding:16px;text-align:left;cursor:pointer;width:100%;min-height:74px;
}
.kind.on{border-color:#2563eb;background:#eff6ff;box-shadow:0 10px 24px -18px rgba(37,99,235,.9)}
.kind .ico{width:42px;height:42px;border-radius:13px;background:#eef2ff;color:#3730a3;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:0 0 auto}
.kind.on .ico{background:#2563eb;color:#fff}
.kind .kt{font-weight:700;font-size:16px;display:block}
.kind .ks{font-size:12.5px;color:var(--muted)}
.kind .dot{margin-left:auto;width:22px;height:22px;border-radius:50%;border:1.5px solid #cbd5e1;flex:0 0 auto}
.kind.on .dot{border:6px solid #2563eb}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#e9edf5;border-radius:14px;padding:5px}
.seg button{appearance:none;border:0;background:transparent;border-radius:10px;padding:11px 8px;font-weight:600;font-size:15px;cursor:pointer;min-height:46px}
.seg button.on{background:#fff;color:#1d4ed8;box-shadow:0 4px 12px -6px rgba(17,24,39,.35)}

/* ---------- 刷题 ---------- */
#screen-quiz{height:100dvh;min-height:0}
.qhead{position:sticky;top:0;z-index:9;background:rgba(244,246,251,.94);backdrop-filter:blur(10px)}
.qhead .line{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 6px}
.qtag{font-size:12px;font-weight:700;color:#1d4ed8;background:#e0e7ff;padding:4px 9px;border-radius:8px;letter-spacing:.5px}
.qprog{font-size:13px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.starbtn{appearance:none;border:0;background:transparent;width:42px;height:42px;font-size:24px;line-height:1;color:#cbd5e1;cursor:pointer}
.starbtn.on{color:#f59e0b}
.bar{height:5px;background:#e5e7eb;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3b82f6,#6366f1);transition:width .25s ease}
.qbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px 16px}
.qnum{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
.qnum b{font-size:14px;color:#374151}
.stem{font-size:19px;line-height:1.7;font-weight:600;letter-spacing:.2px;margin-bottom:18px;white-space:pre-wrap;word-break:break-word}
.qfig{margin:-4px 0 18px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px;text-align:center}
.qfig img{display:block;max-width:100%;height:auto;margin:0 auto}
.options{display:flex;flex-direction:column}
.opt{
  display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;background:#fff;
  border:1.5px solid var(--line);border-radius:14px;padding:14px 13px;margin-bottom:10px;
  font-size:16.5px;line-height:1.55;cursor:pointer;min-height:56px;transition:border-color .15s,background .15s;
}
.opt:active{background:#f8fafc}
.opt .k{
  flex:0 0 27px;height:27px;border-radius:8px;background:#f3f4f6;color:#4b5563;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;margin-top:1px;
}
.opt .t{flex:1;word-break:break-word}
.opt.correct{border-color:#22c55e;background:#f0fdf4}
.opt.correct .k{background:#16a34a;color:#fff}
.opt.wrong{border-color:#f87171;background:#fef2f2}
.opt.wrong .k{background:#dc2626;color:#fff}
.opt.dim{opacity:.62}
.opt[disabled]{cursor:default}
.feedback{display:none;margin-top:6px;border-radius:14px;padding:13px 14px;border:1px solid transparent}
.feedback.show{display:block;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}
.feedback.ok{background:#ecfdf5;border-color:#bbf7d0}
.feedback.bad{background:#fef2f2;border-color:#fecaca}
.fb-title{font-weight:700;font-size:15.5px;margin-bottom:2px}
.feedback.ok .fb-title{color:#15803d}
.feedback.bad .fb-title{color:#b91c1c}
.fb-sub{font-size:14px;color:#4b5563;word-break:break-word}
.qfoot{
  position:sticky;bottom:0;z-index:8;display:flex;align-items:center;gap:9px;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(--line);
}
.qfoot .btn{width:auto;flex:1;min-height:50px;font-size:15.5px;padding:12px 10px}
.qfoot .btn-primary{flex:1.25}
.qscore{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100% + 6px);
  background:rgba(17,24,39,.82);color:#fff;font-size:11px;padding:4px 9px;border-radius:999px;white-space:nowrap}
.qfoot-wrap{position:relative}

/* ---------- 结果 ---------- */
.result-wrap{padding:34px 20px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.result-card{background:#fff;border-radius:24px;padding:26px 20px;text-align:center;box-shadow:var(--shadow);border:1px solid var(--line)}
.result-card .big{font-size:54px;font-weight:800;letter-spacing:-1px;line-height:1.1;
  background:linear-gradient(135deg,#2563eb,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent}
.result-card .cap{font-size:13px;color:var(--muted);margin-top:2px}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:20px}
.rg{background:#f8fafc;border:1px solid var(--line);border-radius:14px;padding:10px 6px}
.rg b{display:block;font-size:19px}
.rg span{font-size:11.5px;color:var(--muted)}

/* ---------- 列表 ---------- */
.list-wrap{padding:14px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.list-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:4px}
.qrow{display:flex;align-items:stretch;gap:8px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.qrow .main{flex:1;text-align:left;background:transparent;border:0;padding:13px 14px;cursor:pointer;min-width:0}
.qrow .main:active{background:#f8fafc}
.qrow .meta{display:flex;align-items:center;gap:7px;margin-bottom:4px}
.qrow .tag{font-size:11px;font-weight:700;color:#1d4ed8;background:#e0e7ff;padding:2px 7px;border-radius:6px}
.qrow .no{font-size:11.5px;color:var(--muted)}
.qrow .txt{font-size:14.5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .side{flex:0 0 50px;border:0;border-left:1px solid var(--line);background:#fff;color:#f59e0b;font-size:21px;cursor:pointer}
.qrow .side.remove{color:#9ca3af;font-size:18px}
.empty{text-align:center;color:var(--muted);font-size:14px;padding:60px 20px;line-height:2}
.empty .e-ico{font-size:40px;display:block;margin-bottom:8px;opacity:.35}
.foot-note{text-align:center;color:#9ca3af;font-size:11.5px;padding:2px 0 8px}
</style>
</head>
<body>
<div id="app">

  <!-- 首页 -->
  <section id="screen-home" class="screen active">
    <div class="hero">
      <div class="hero-top">
        <span class="chip">CNC · 数控技术</span>
        <span class="hero-meta">共 170 题</span>
      </div>
      <h1>数控技术刷题</h1>
      <p>逐题练习 · 即时判定 · 错题与收藏自动保存</p>
      <div class="hero-stats">
        <div class="hstat"><b id="hsAnswered">0</b><span>累计答题</span></div>
        <div class="hstat"><b id="hsRate">—</b><span>正确率</span></div>
        <div class="hstat"><b id="hsWrong">0</b><span>错题</span></div>
      </div>
    </div>
    <div class="home-actions">
      <button id="resumeBtn" class="resume hidden" type="button">继续上次刷题</button>
      <button class="btn btn-primary" type="button" onclick="openStart()">开始刷题</button>
      <button class="btn btn-soft" type="button" onclick="openList('fav')">收藏题目 <span id="homeFavCount" style="color:#6b7280;font-weight:500"></span></button>
      <div class="row2">
        <button class="btn btn-ghost" type="button" onclick="openList('wrong')">错题本</button>
        <button class="btn btn-ghost" type="button" onclick="resetAll()">清空记录</button>
      </div>
      <div class="home-tip">单选题 130 道 · 判断题 40 道<br>进度保存在本机浏览器，关闭页面不丢失</div>
    </div>
  </section>

  <!-- 开始设置 -->
  <section id="screen-start" class="screen">
    <div class="topbar">
      <button class="icon-btn" type="button" onclick="goHome()">‹</button>
      <div class="title">开始刷题</div>
    </div>
    <div class="pad">
      <div>
        <p class="section-label">选择题型</p>
        <div class="kind-list" id="kindList">
          <button class="kind on" type="button" data-kind="single">
            <span class="ico">单选</span>
            <span><span class="kt">单选题</span><span class="ks">共 130 道 · 四选一</span></span>
            <span class="dot"></span>
          </button>
          <button class="kind" type="button" data-kind="judge">
            <span class="ico">判断</span>
            <span><span class="kt">判断题</span><span class="ks">共 40 道 · 正确 / 错误</span></span>
            <span class="dot"></span>
          </button>
          <button class="kind" type="button" data-kind="all">
            <span class="ico">全部</span>
            <span><span class="kt">全部题目</span><span class="ks">共 170 道 · 混合练习</span></span>
            <span class="dot"></span>
          </button>
        </div>
      </div>
      <div>
        <p class="section-label">刷题顺序</p>
        <div class="seg" id="modeSeg">
          <button class="on" type="button" data-mode="seq">顺序刷</button>
          <button type="button" data-mode="random">随机刷</button>
        </div>
      </div>
      <button class="btn btn-primary" type="button" onclick="startFromSetup()">开始练习</button>
    </div>
  </section>

  <!-- 刷题 -->
  <section id="screen-quiz" class="screen">
    <div class="qhead">
      <div class="line">
        <button class="icon-btn" type="button" onclick="goHome()">‹</button>
        <span class="qtag" id="qTag">单选题</span>
        <span class="qprog" id="qProg">1 / 130</span>
        <button class="starbtn" type="button" id="favBtn" onclick="toggleFav()" aria-label="收藏">☆</button>
      </div>
      <div class="bar"><i id="barFill"></i></div>
    </div>
    <div class="qbody">
      <div class="qnum">第 <b id="qNo">1</b> 题</div>
      <div class="stem" id="qStem"></div>
      <div class="qfig hidden" id="qFig"><img id="qImg" alt="题目示意图"></div>
      <div class="options" id="qOptions"></div>
      <div class="feedback" id="qFeedback"></div>
    </div>
    <div class="qfoot">
      <div class="qfoot-wrap" id="qScore" style="font-size:11.5px;color:#6b7280;white-space:nowrap"></div>
      <button class="btn btn-soft" type="button" id="prevBtn" onclick="prevQ()">上一题</button>
      <button class="btn btn-primary" type="button" id="nextBtn" onclick="nextQ()">下一题</button>
    </div>
  </section>

  <!-- 结果 -->
  <section id="screen-result" class="screen">
    <div class="topbar">
      <button class="icon-btn" type="button" onclick="goHome()">‹</button>
      <div class="title">练习结果</div>
    </div>
    <div class="result-wrap">
      <div class="result-card">
        <div class="big" id="rRate">0%</div>
        <div class="cap">本次正确率</div>
        <div class="result-grid">
          <div class="rg"><b id="rTotal">0</b><span>题目总数</span></div>
          <div class="rg"><b id="rAnswered">0</b><span>已作答</span></div>
          <div class="rg"><b id="rCorrect">0</b><span>答对</span></div>
        </div>
      </div>
      <button class="btn btn-primary" type="button" id="rAgain">再练一次</button>
      <button class="btn btn-soft" type="button" onclick="openList('wrong')">查看错题本</button>
      <button class="btn btn-ghost" type="button" onclick="goHome()">返回首页</button>
    </div>
  </section>

  <!-- 收藏 / 错题列表 -->
  <section id="screen-list" class="screen">
    <div class="topbar">
      <button class="icon-btn" type="button" onclick="goHome()">‹</button>
      <div class="title" id="listTitle">收藏题目</div>
      <div class="sub" id="listSub"></div>
    </div>
    <div class="list-wrap">
      <div class="list-actions">
        <button class="btn btn-primary" type="button" id="listPractice">开始练习</button>
        <button class="btn btn-soft" type="button" id="listClear">清空列表</button>
      </div>
      <div id="listBody"></div>
      <div class="foot-note">点击题目可从该题开始练习</div>
    </div>
  </section>

</div>

var IDX = {};
BANK.forEach(function(q){ IDX[q.id] = q; });

var LS = {
  get: function(k, d){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set: function(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};

var STATS = LS.get('cncquiz.stats', {answered:0, correct:0});
var FAV = (LS.get('cncquiz.fav', []) || []).filter(function(id){ return IDX[id]; });
var WRONG = (LS.get('cncquiz.wrong', []) || []).filter(function(id){ return IDX[id]; });
var S = LS.get('cncquiz.session', null);
if (S && (!S.list || !S.list.length || S.idx >= S.list.length)) S = null;
var setup = { kind:'single', mode:'seq' };
var listMode = 'fav';
var lastResult = null;

function $(sel){ return document.querySelector(sel); }
function show(id){
  var list = document.querySelectorAll('.screen');
  for (var i=0;i<list.length;i++) list[i].classList.remove('active');
  $(id).classList.add('active');
  window.scrollTo(0,0);
}
function goHome(){ renderHome(); show('#screen-home'); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function typeName(q){ return q.type === 'single' ? '单选题' : '判断题'; }
function labelOf(q, val){
  if (q.type === 'judge') return val;
  var i = 'ABCD'.indexOf(val);
  return val + '. ' + q.options[i];
}
function idsOf(kind){
  if (kind === 'single') return BANK.filter(function(q){ return q.type==='single'; }).map(function(q){ return q.id; });
  if (kind === 'judge') return BANK.filter(function(q){ return q.type==='judge'; }).map(function(q){ return q.id; });
  return BANK.map(function(q){ return q.id; });
}
function shuffle(a){
  a = a.slice();
  for (var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; }
  return a;
}

/* ---------- 首页 ---------- */
function renderHome(){
  $('#hsAnswered').textContent = STATS.answered || 0;
  $('#hsRate').textContent = STATS.answered ? Math.round(STATS.correct / STATS.answered * 100) + '%' : '—';
  $('#hsWrong').textContent = WRONG.length;
  $('#homeFavCount').textContent = FAV.length ? '(' + FAV.length + ')' : '';
  var rb = $('#resumeBtn');
  if (S){
    var t = S.kind === 'fav' ? '收藏练习' : (S.kind === 'wrong' ? '错题练习' : (S.kind === 'all' ? '全部题目' : (S.kind === 'single' ? '单选题' : '判断题')));
    rb.textContent = '继续上次：' + t + ' 第 ' + (S.idx+1) + '/' + S.list.length + ' 题';
    rb.classList.remove('hidden');
  } else {
    rb.classList.add('hidden');
  }
}

/* ---------- 开始设置 ---------- */
function openStart(){
  setup.kind = 'single'; setup.mode = 'seq';
  var kinds = document.querySelectorAll('#kindList .kind');
  for (var i=0;i<kinds.length;i++) kinds[i].classList.toggle('on', kinds[i].getAttribute('data-kind') === 'single');
  var modes = document.querySelectorAll('#modeSeg button');
  for (var j=0;j<modes.length;j++) modes[j].classList.toggle('on', modes[j].getAttribute('data-mode') === 'seq');
  show('#screen-start');
}
document.querySelector('#kindList').addEventListener('click', function(e){
  var b = e.target.closest('.kind'); if(!b) return;
  setup.kind = b.getAttribute('data-kind');
  var kinds = document.querySelectorAll('#kindList .kind');
  for (var i=0;i<kinds.length;i++) kinds[i].classList.toggle('on', kinds[i] === b);
});
document.querySelector('#modeSeg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return;
  setup.mode = b.getAttribute('data-mode');
  var modes = document.querySelectorAll('#modeSeg button');
  for (var i=0;i<modes.length;i++) modes[i].classList.toggle('on', modes[i] === b);
});
function startFromSetup(){
  var list = idsOf(setup.kind);
  if (setup.mode === 'random') list = shuffle(list);
  beginSession(setup.kind, setup.mode, list, 0);
}
function resumeSession(){ if (S) { show('#screen-quiz'); renderQuiz(); } }

/* ---------- 会话 ---------- */
function beginSession(kind, mode, list, startIndex){
  if (!list || !list.length){ alert('暂无可练习的题目'); return; }
  S = { kind:kind, mode:mode, list:list, idx:startIndex||0, answers:{} };
  saveSession();
  show('#screen-quiz');
  renderQuiz();
}
function saveSession(){ if (S) LS.set('cncquiz.session', S); }
function currentQ(){ return S ? IDX[S.list[S.idx]] : null; }

function renderQuiz(){
  var q = currentQ();
  if (!q){ finish(); return; }
  $('#qTag').textContent = typeName(q);
  $('#qProg').textContent = (S.idx+1) + ' / ' + S.list.length;
  $('#barFill').style.width = ((S.idx+1) / S.list.length * 100) + '%';
  $('#qNo').textContent = q.no;
  $('#qStem').textContent = q.stem;
  var fig = $('#qFig');
  if (q.image){
    $('#qImg').src = q.image;
    fig.classList.remove('hidden');
  } else {
    $('#qImg').removeAttribute('src');
    fig.classList.add('hidden');
  }

  var chosen = S.answers[q.id];
  var box = $('#qOptions');
  box.innerHTML = '';
  q.options.forEach(function(text, i){
    var val = q.type === 'single' ? 'ABCD'[i] : text;
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'opt';
    var k = document.createElement('span'); k.className = 'k';
    k.textContent = q.type === 'single' ? 'ABCD'[i] : (i === 0 ? '✓' : '✗');
    var t = document.createElement('span'); t.className = 't'; t.textContent = text;
    b.appendChild(k); b.appendChild(t);
    if (chosen){
      b.disabled = true;
      if (val === q.answer) b.classList.add('correct');
      else if (val === chosen) b.classList.add('wrong');
      else b.classList.add('dim');
    } else {
      b.addEventListener('click', function(){ answer(val); });
    }
    box.appendChild(b);
  });

  var fb = $('#qFeedback');
  if (chosen){
    var ok = chosen === q.answer;
    fb.className = 'feedback show ' + (ok ? 'ok' : 'bad');
    fb.innerHTML = '<div class="fb-title">' + (ok ? '回答正确' : '回答错误') + '</div>' +
                   '<div class="fb-sub">正确答案：' + esc(labelOf(q, q.answer)) + '</div>';
  } else {
    fb.className = 'feedback';
    fb.innerHTML = '';
  }

  var cnt = 0, cor = 0;
  S.list.forEach(function(id){
    if (S.answers[id] !== undefined){ cnt++; if (S.answers[id] === IDX[id].answer) cor++; }
  });
  $('#qScore').textContent = '已答 ' + cnt + ' · 答对 ' + cor;

  var isFav = FAV.indexOf(q.id) >= 0;
  var fb2 = $('#favBtn');
  fb2.textContent = isFav ? '★' : '☆';
  fb2.classList.toggle('on', isFav);
  $('#prevBtn').disabled = S.idx === 0;
  $('#nextBtn').textContent = S.idx === S.list.length - 1 ? '完成' : '下一题';
  saveSession();
}

function answer(val){
  var q = currentQ();
  if (!q || S.answers[q.id] !== undefined) return;
  S.answers[q.id] = val;
  var ok = val === q.answer;
  STATS.answered = (STATS.answered || 0) + 1;
  if (ok) STATS.correct = (STATS.correct || 0) + 1;
  LS.set('cncquiz.stats', STATS);
  var wi = WRONG.indexOf(q.id);
  if (ok){
    if (wi >= 0){ WRONG.splice(wi,1); LS.set('cncquiz.wrong', WRONG); }
  } else if (wi < 0){
    WRONG.push(q.id); LS.set('cncquiz.wrong', WRONG);
  }
  renderQuiz();
}

function nextQ(){
  if (!S) return;
  if (S.idx < S.list.length - 1){ S.idx++; saveSession(); renderQuiz(); }
  else finish();
}
function prevQ(){
  if (!S || S.idx === 0) return;
  S.idx--; saveSession(); renderQuiz();
}

function finish(){
  if (!S) return;
  var total = S.list.length, answered = 0, correct = 0, wrongIds = [];
  S.list.forEach(function(id){
    var a = S.answers[id];
    if (a !== undefined){
      answered++;
      if (a === IDX[id].answer) correct++;
      else wrongIds.push(id);
    }
  });
  lastResult = { kind:S.kind, mode:S.mode, list:S.list.slice(), total:total, answered:answered, correct:correct, wrongIds:wrongIds };
  S = null; LS.del('cncquiz.session');
  $('#rRate').textContent = answered ? Math.round(correct/answered*100) + '%' : '0%';
  $('#rTotal').textContent = total;
  $('#rAnswered').textContent = answered;
  $('#rCorrect').textContent = correct;
  $('#rAgain').onclick = function(){
    var lr = lastResult;
    var list = lr.list.slice();
    if (lr.mode === 'random') list = shuffle(list);
    beginSession(lr.kind, lr.mode, list, 0);
  };
  show('#screen-result');
  renderHome();
}

/* ---------- 收藏 ---------- */
function toggleFav(){
  var q = currentQ(); if (!q) return;
  var i = FAV.indexOf(q.id);
  if (i >= 0) FAV.splice(i,1); else FAV.push(q.id);
  LS.set('cncquiz.fav', FAV);
  renderQuiz();
}

/* ---------- 列表 ---------- */
function openList(mode){
  listMode = mode;
  renderList();
  show('#screen-list');
}
function renderList(){
  var items = listMode === 'fav' ? FAV.slice() : WRONG.slice();
  $('#listTitle').textContent = listMode === 'fav' ? '收藏题目' : '错题本';
  $('#listSub').textContent = items.length ? items.length + ' 题' : '';
  $('#listPractice').textContent = listMode === 'fav' ? '练习收藏' : '练习错题';
  $('#listPractice').disabled = items.length === 0;
  $('#listClear').disabled = items.length === 0;
  $('#listClear').textContent = '清空列表';
  var body = $('#listBody');
  body.innerHTML = '';
  if (!items.length){
    body.innerHTML = '<div class="empty"><span class="e-ico">' + (listMode === 'fav' ? '☆' : '✓') + '</span>' +
      (listMode === 'fav' ? '还没有收藏题目<br>刷题时点击右上角 ☆ 即可收藏' : '错题本是空的<br>答错的题会自动收进这里') + '</div>';
    return;
  }
  items.forEach(function(id, i){
    var q = IDX[id];
    var row = document.createElement('div'); row.className = 'qrow';
    var main = document.createElement('button'); main.type = 'button'; main.className = 'main';
    main.innerHTML = '<div class="meta"><span class="tag">' + typeName(q) + '</span><span class="no">第 ' + q.no + ' 题</span></div>' +
                     '<div class="txt">' + esc(q.stem) + '</div>';
    main.addEventListener('click', function(){ practiceFromList(listMode, i); });
    var side = document.createElement('button'); side.type = 'button';
    side.className = 'side' + (listMode === 'fav' ? '' : ' remove');
    side.textContent = listMode === 'fav' ? '★' : '×';
    side.setAttribute('aria-label', listMode === 'fav' ? '取消收藏' : '移出错题本');
    side.addEventListener('click', function(){
      if (listMode === 'fav'){
        var fi = FAV.indexOf(id); if (fi >= 0) FAV.splice(fi,1); LS.set('cncquiz.fav', FAV);
      } else {
        var wi = WRONG.indexOf(id); if (wi >= 0) WRONG.splice(wi,1); LS.set('cncquiz.wrong', WRONG);
      }
      renderList(); renderHome();
    });
    row.appendChild(main); row.appendChild(side); body.appendChild(row);
  });
}
function practiceFromList(mode, index){
  var items = mode === 'fav' ? FAV.slice() : WRONG.slice();
  if (!items.length) return;
  beginSession(mode, 'seq', items, index);
}
document.querySelector('#listPractice').addEventListener('click', function(){
  practiceFromList(listMode, 0);
});
document.querySelector('#listClear').addEventListener('click', function(){
  if (listMode === 'fav'){
    if (!FAV.length) return;
    if (confirm('确定清空收藏题目吗？')){ FAV = []; LS.set('cncquiz.fav', FAV); renderList(); renderHome(); }
  } else {
    if (!WRONG.length) return;
    if (confirm('确定清空错题本吗？')){ WRONG = []; LS.set('cncquiz.wrong', WRONG); renderList(); renderHome(); }
  }
});

/* ---------- 清空全部 ---------- */
function resetAll(){
  if (!confirm('确定清空全部记录吗？\n（累计答题、错题本、收藏和未完成的进度都会被删除）')) return;
  STATS = {answered:0, correct:0}; FAV = []; WRONG = []; S = null;
  LS.del('cncquiz.stats'); LS.del('cncquiz.fav'); LS.del('cncquiz.wrong'); LS.del('cncquiz.session');
  renderHome();
}

$('#resumeBtn').addEventListener('click', resumeSession);
renderHome();
</script>
</body>
</html>
